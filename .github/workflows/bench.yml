name: bench

# 1.2.18+ I.1.7 — performance regression gate.
#
# On push to main: run the criterion bench suite + upload
# the result tree as the `bench-baseline` artifact (the
# reference every PR compares against).
#
# On pull_request: download the latest main baseline, run
# the suite, compare via `inkhaven _bench-report`, post a
# delta table as a PR comment, and FAIL the job when any
# scenario regresses >20%.
#
# Fixture sizing: CI uses a ~250-paragraph fixture (1 book
# × 5 chapters × 50 paragraphs, ~30s to generate) rather
# than the full 10K (~20 min). It's large enough to
# exercise the algorithmic paths the gate exists to
# protect — the I.1.4 lazy-engine + I.1.5 O(n)-flatten
# wins both show up as multiples, not 20% drifts, so the
# smaller fixture catches a regression just as reliably.
# The fixture is MULTILINGUAL (en,ru,fr,de,es, round-robin
# per book) so the baseline exercises the Unicode
# tokenise→embed→search→export paths, not just ASCII.
#
# The full 10K baseline is available on demand via the
# workflow_dispatch inputs below (books/chapters/paragraphs)
# — it is deliberately NOT run on every push/PR (the ~250-¶
# gate already catches structural regressions; a 20-min run
# per PR is not worth it).
#
# Benches run: startup, search, render, scale, export, graph —
# all deterministic + offline. The `index` (embedding-throughput)
# bench is EXCLUDED from the gate: it builds the fastembed
# engine, which downloads the ONNX model on first use — a
# network dependency that would make the gate slow + flaky.
# Run it locally: `cargo bench --bench index`.
#
# A note on shared-runner noise: absolute wall-clock
# drifts between GitHub runners, so the 20% threshold is
# deliberately loose. The regressions worth gating here
# are structural (re-introducing eager model load, or
# making flatten O(n²) again) — those are order-of-
# magnitude, not marginal.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      books:
        description: "Fixture books (25 ≈ 6.25k ¶; 40 ≈ 10k ¶)"
        default: "1"
      chapters:
        description: "Chapters per book"
        default: "5"
      paragraphs:
        description: "Paragraphs per chapter"
        default: "50"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BENCH_FIXTURE: /tmp/inkhaven-bench-fixture

jobs:
  bench:
    name: criterion bench gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same native deps as ci.yml — bdslib transitive +
      # typst font discovery.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libssl-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libasound2-dev \
            fonts-dejavu-core

      # See ci.yml: free ~20 GB so the ~3.7 GB duckdb-heavy rust-cache can
      # extract without overflowing the runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary + benches
        run: |
          cargo build --release --locked
          cargo bench --no-run --locked

      - name: Generate bench fixture
        run: |
          # Defaults give the ~250-¶ gate fixture; workflow_dispatch inputs
          # override for an on-demand 10k baseline. `|| 'N'` supplies the
          # default on push/PR events (where inputs.* is empty).
          BOOKS="${{ inputs.books || '1' }}"
          CHAPTERS="${{ inputs.chapters || '5' }}"
          PARAGRAPHS="${{ inputs.paragraphs || '50' }}"
          echo "Fixture: ${BOOKS}×${CHAPTERS}×${PARAGRAPHS} ¶, multilingual"
          ./target/release/inkhaven gen-fixture "$BENCH_FIXTURE" \
            --books "$BOOKS" --chapters "$CHAPTERS" --paragraphs "$PARAGRAPHS" \
            --languages en,ru,fr,de,es --force

      - name: Run benches
        env:
          INKHAVEN_BENCH_FIXTURE: ${{ env.BENCH_FIXTURE }}
        run: |
          # index (embedding-throughput) is excluded — it downloads the ONNX
          # model at runtime. All benches below are deterministic + offline.
          # graph is the SEMNET knowledge-graph edge-store throughput (self-
          # contained temp store; no fixture / network).
          cargo bench --bench startup --bench search \
            --bench render --bench scale --bench export --bench graph

      # ── main branch: publish the baseline ────────────
      - name: Upload baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: target/criterion
          retention-days: 90

      # ── PR: download the main baseline + compare ─────
      #
      # The built-in actions/download-artifact can only
      # fetch artifacts from the *current* run; we need the
      # latest baseline from a *prior* main run.
      # dawidd6/action-download-artifact is the standard
      # tool for "grab the newest artifact from branch
      # main".  continue-on-error so the first-ever PR (no
      # main baseline yet) doesn't hard-fail — _bench-report
      # treats a missing baseline as "everything new".
      - name: Download main baseline (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          name: bench-baseline
          path: /tmp/bench-baseline
          branch: main
          workflow: bench.yml
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Compare + render report (PR only)
        if: github.event_name == 'pull_request'
        id: report
        run: |
          # If the baseline download failed (first run, or
          # no main baseline yet) /tmp/bench-baseline won't
          # exist — _bench-report treats a missing baseline
          # as "everything is new" + exits 0.
          set +e
          ./target/release/inkhaven _bench-report \
            --baseline /tmp/bench-baseline \
            --current target/criterion \
            --threshold 0.20 \
            --markdown > /tmp/bench-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/bench-report.md

      - name: Post report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/bench-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on regression (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.report.outputs.exit_code }}" = "2" ]; then
            echo "::error::Performance regression detected — see the PR comment."
            exit 1
          fi
          echo "No performance regression."
